<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Neon Noir font rendering. Slight hinting and subpixel order to match the
     design's type: the UI face is a humanist sans at small sizes, and full
     hinting distorts its stems. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
  </match>

  <!-- Keep bitmap fonts out; they ruin the type at fractional scaling. -->
  <selectfont><rejectfont><pattern>
    <patelt name="scalable"><bool>false</bool></patelt>
  </pattern></rejectfont></selectfont>

  <alias><family>sans-serif</family><prefer><family>IBM Plex Sans</family></prefer></alias>
  <alias><family>sans</family><prefer><family>IBM Plex Sans</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias><family>system-ui</family><prefer><family>IBM Plex Sans</family></prefer></alias>
</fontconfig>
